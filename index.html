
<!DOCTYPE html>
<html>
  <head>
    <title>AR Avtomobil Demo</title>
    <script src="https://cdn.jsdelivr.net/npm/aframe@1.2.0/dist/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.1.4/dist/mindar-image-aframe.prod.js"></script>
    <style>
      body { margin: 0; overflow: hidden; }
      #ar-container { width: 100%; height: 100vh; position: fixed; top: 0; left: 0; }
    </style>
  </head>
  <body>
    <div id="ar-container">
      <a-scene mindar-image="imageTargetSrc: targets.mind;" embedded color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: true">
        <a-assets>
          <a-asset-item id="carModel" src="red_car.glb"></a-asset-item>
        </a-assets>
        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
        <a-entity mindar-image-target="targetIndex: 0">
          <a-gltf-model src="#carModel" position="0 0 0" rotation="0 180 0" scale="0.05 0.05 0.05"></a-gltf-model>
        </a-entity>
      </a-scene>
    </div>
  </body>
</html>
